[project]
name = "carecenter-for-codex"
version = "0.8.0"
description = "Unofficial local Windows tray + CLI to repair, clean up and maintain the OpenAI Codex desktop app"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Lukas Geiger" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: System :: Systems Administration",
    "Environment :: Win32 (MS Windows)",
]

dependencies = [
    "PySide6>=6.7",
    "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/dev-bricks/CareCenter-for-Codex"
Documentation = "https://github.com/dev-bricks/CareCenter-for-Codex#readme"
Repository = "https://github.com/dev-bricks/CareCenter-for-Codex.git"
Issues = "https://github.com/dev-bricks/CareCenter-for-Codex/issues"
Changelog = "https://github.com/dev-bricks/CareCenter-for-Codex/blob/main/CHANGELOG.md"
Security = "https://github.com/dev-bricks/CareCenter-for-Codex/blob/main/SECURITY.md"
"Parent Organization" = "https://github.com/dev-bricks"
Umbrella = "https://github.com/open-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"LLM Ready" = "https://github.com/dev-bricks/CareCenter-for-Codex/blob/main/llms.txt"
"Marketing Log" = "https://github.com/dev-bricks/CareCenter-for-Codex/blob/main/MARKETING-LOG.txt"
"Third-Party Licenses" = "https://github.com/dev-bricks/CareCenter-for-Codex/blob/main/THIRD_PARTY_LICENSES.md"
"Bug Tracker" = "https://github.com/dev-bricks/CareCenter-for-Codex/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
build = [
    "safe-start-for-codex @ git+https://github.com/dev-bricks/safe-start-for-codex.git@dcb369a64f403f6551bcb3bac16565c56ec79474",
    "pyinstaller>=6.0",
    "hatchling>=1.25",
]

[project.scripts]
codex-logwartung = "codex_logdatenbank_wartung.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_logdatenbank_wartung"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v"
testpaths = ["tests"]
pythonpath = ["src"]
